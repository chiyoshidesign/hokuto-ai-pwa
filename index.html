<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="北斗AI">
  <title>北斗AI 実戦記録 V7.0</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header">
  <div>
    <div class="eyebrow">HOKUTO AI V7.0</div>
    <h1>実戦記録</h1>
  </div>
  <span id="saveState" class="save-state">自動保存</span>
</header>

<main>
  <section class="card hero">
    <div class="hero-row">
      <div>
        <span class="label">本日の台</span>
        <strong id="heroMachine">未入力</strong>
      </div>
      <div>
        <span class="label">現在収支</span>
        <strong id="heroProfit">0円</strong>
      </div>
    </div>
    <div class="hero-row compact">
      <span id="heroStatus">入力を開始してください</span>
      <span id="heroElapsed">--:--</span>
    </div>
  </section>

  <form id="recordForm" novalidate>
    <section class="card">
      <h2>基本情報</h2>
      <div class="grid two">
        <label>実戦日<input id="playDate" type="date" required></label>
        <label>店舗<input id="storeName" type="text" value="グランワールドカップ本巣店"></label>
        <label>機種<input id="machineName" type="text" value="北斗11"></label>
        <label>現在台番号<input id="machineNo" type="number" inputmode="numeric" placeholder="14" required></label>
        <label>AI順位<input id="aiRank" type="number" inputmode="numeric" min="1" max="21" placeholder="例：3"></label>
        <label>AI判定
          <select id="aiDecision">
            <option value="">未選択</option>
            <option>条件付き実戦候補</option>
            <option>慎重に実戦</option>
            <option>見送り</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>開始時</h2>
      <div class="grid two">
        <label>開始時刻<input id="startTime" type="time"></label>
        <label>開始回転数<input id="startRotation" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>開始時総大当り<input id="startTotalHits" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>開始時初当り<input id="startFirstHits" type="number" inputmode="numeric" min="0" placeholder="0"></label>
      </div>
      <button class="primary" type="button" id="startButton">実戦開始</button>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>当たり記録</h2>
        <button class="small" type="button" id="addHitButton">＋ 当たり追加</button>
      </div>
      <div id="hitList" class="hit-list"></div>
      <p class="hint">初当たりごとに追加します。RUSHなしは連チャン数「1」で記録できます。</p>
    </section>

    <section class="card">
      <h2>投資・回収</h2>
      <div class="grid two">
        <label>現金投資（円）<input id="cashInvestment" type="number" inputmode="numeric" min="0" step="1000" placeholder="0"></label>
        <label>持ち玉投資（玉）<input id="ballInvestment" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>回収玉数<input id="recoveredBalls" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>現金回収（円）<input id="cashRecovery" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>交換率（玉/千円）<input id="exchangeRate" type="number" inputmode="decimal" min="1" step="0.1" value="225"></label>
        <label>自動計算収支<input id="calculatedProfit" type="text" readonly value="0円"></label>
      </div>
    </section>

    <section class="card">
      <h2>終了時</h2>
      <div class="grid two">
        <label>終了時刻<input id="endTime" type="time"></label>
        <label>終了回転数<input id="endRotation" type="number" inputmode="numeric" min="0" placeholder="0"></label>
        <label>終了理由
          <select id="stopReason">
            <option value="">未選択</option>
            <option>予算上限</option>
            <option>回転率不足</option>
            <option>時間終了</option>
            <option>勝ち逃げ</option>
            <option>持ち玉消滅</option>
            <option>その他</option>
          </select>
        </label>
        <label>最終判定
          <select id="resultJudgement">
            <option value="">自動判定</option>
            <option>勝ち</option>
            <option>負け</option>
            <option>引き分け</option>
          </select>
        </label>
      </div>
      <label>メモ<textarea id="notes" rows="4" placeholder="釘、回転率、演出、やめ判断など"></textarea></label>
    </section>

    <section class="card actions">
      <button class="primary" type="button" id="finishButton">実戦終了・保存</button>
      <button type="button" id="shareButton">CSVを共有／保存</button>
      <button type="button" id="jsonButton">JSONバックアップ</button>
      <button class="danger" type="button" id="newButton">新しい記録</button>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>保存済み記録</h2>
        <button class="small" type="button" id="exportAllButton">全件CSV</button>
      </div>
      <div id="savedRecords" class="saved-records"></div>
    </section>
  </form>
</main>

<template id="hitTemplate">
  <article class="hit-item">
    <div class="section-head">
      <strong class="hit-title">当たり</strong>
      <button type="button" class="small danger remove-hit">削除</button>
    </div>
    <div class="grid two">
      <label>当選時回転数<input class="hit-rotation" type="number" inputmode="numeric" min="0"></label>
      <label>追加投資累計（円）<input class="hit-investment" type="number" inputmode="numeric" min="0" step="1000"></label>
      <label>RUSH
        <select class="hit-rush">
          <option value="">未選択</option>
          <option value="1">突入</option>
          <option value="0">非突入</option>
        </select>
      </label>
      <label>連チャン数<input class="hit-chain" type="number" inputmode="numeric" min="1" value="1"></label>
      <label>獲得出玉<input class="hit-balls" type="number" inputmode="numeric" min="0"></label>
      <label>当たり後やめ回転<input class="hit-after-rotation" type="number" inputmode="numeric" min="0"></label>
    </div>
  </article>
</template>

<script src="./app.js"></script>
</body>
</html>
